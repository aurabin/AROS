name: Odyssey x86-64 cross-build
on:
  push:
    branches: [feature/aros-wizard-roadmap]
    paths:
      - '.github/workflows/odyssey-cross-build.yml'
  workflow_dispatch:
    inputs:
      odyssey_commit:
        description: 'Full Odyssey upstream commit SHA (40 hex digits)'
        required: true
        default: '8e44b6d8d2e8c57a59a878152b81304e220ceb7a'
        type: string
jobs:
  cross-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    permissions:
      contents: read
    env:
      ODYSSEY_COMMIT: ${{ inputs.odyssey_commit || '8e44b6d8d2e8c57a59a878152b81304e220ceb7a' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate requested source revision
        shell: bash
        run: |
          [[ "$ODYSSEY_COMMIT" =~ ^[a-fA-F0-9]{40}$ ]] || { echo 'Expected full 40-character SHA' >&2; exit 2; }
      - name: Install AROS and Odyssey host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gawk bison flex bzip2 netpbm autoconf automake libx11-dev libxext-dev libc6-dev liblzo2-dev libxxf86vm-dev libpng-dev gcc-multilib g++-multilib libsdl1.2-dev byacc python3-mako libxcursor-dev cmake genisoimage dh-make yasm nasm gperf ruby ninja-build libtool texinfo wget
      - name: Build AROS cross-compiler and SDK from pinned sources
        shell: bash
        run: |
          {
            cd "$RUNNER_TEMP"
            mkdir aros-build
            cd aros-build
            git clone --depth 1 --branch release-20241102 https://github.com/deadwood2/AROS.git AROS
            git clone --depth 1 --branch release-20241102 https://github.com/deadwood2/contrib.git AROS/contrib
            test "$(git -C AROS rev-parse HEAD)" = e3babd663cdaab5ae643a2a7dcf966c7ccd3490e
            test "$(git -C AROS/contrib rev-parse HEAD)" = 4af836fd6d2720a4a72000ad635f706c03b92be9
            workspace="$PWD"
            source "$workspace/AROS/scripts/rebuild-conf"

            # Intel's original archive URL returns HTTP 403 on the hosted runner.
            # Verify the mirror against the OpenEmbedded release checksum.
            mkdir -p "$workspace/portssources"
            archive="$workspace/portssources/acpica-unix-20230331.tar.gz"
            curl --fail --location --retry 3 --output "$archive" https://mirrors.edge.kernel.org/yocto-sources/acpica-unix-20230331.tar.gz
            printf '%s  %s\n' 0c5d695d605aaa61709f3c63f57a1a99b8902291723998446b0813b57ac310e2 "$archive" | sha256sum --check

            process_selection 1
            mkdir -p "$BUILD_DIR" "$TOOLCHAIN_DIR"
            (
              cd "$BUILD_DIR"
              "$workspace/AROS/configure" --target="$CONFIGURE_TARGET" --with-aros-toolchain-install="$TOOLCHAIN_DIR" --with-portssources="$workspace/portssources"
              make -j2 -s crosstools
            )

            process_selection 2
            mkdir -p "$BUILD_DIR"
            (
              cd "$BUILD_DIR"
              "$workspace/AROS/configure" --target="$CONFIGURE_TARGET" --with-aros-toolchain-install="$TOOLCHAIN_DIR" --with-portssources="$workspace/portssources" --with-aros-toolchain=yes --enable-debug
              make -j2
            )
            sdk="$BUILD_DIR/bin/linux-x86_64/AROS/Development"
            test -d "$sdk/include"
            test -d "$sdk/lib"
            mkdir "$workspace/compiler-wrappers"
            for compiler in x86_64-aros-gcc x86_64-aros-g++; do
              test -x "$TOOLCHAIN_DIR/$compiler"
              printf '#!/usr/bin/env bash\nexec %q --sysroot=%q "$@"\n' "$TOOLCHAIN_DIR/$compiler" "$sdk" > "$workspace/compiler-wrappers/$compiler"
              chmod +x "$workspace/compiler-wrappers/$compiler"
            done
            printf '%s\n' "$workspace/compiler-wrappers" >> "$GITHUB_PATH"
            printf 'AROS_SDK_DIR=%s\n' "$sdk" >> "$GITHUB_ENV"
          } 2>&1 | tee "$GITHUB_WORKSPACE/aros-sdk-build.log"
      - name: Check toolchain
        run: bash tools/odyssey/toolchain_preflight.sh
      - name: Check compiler versions
        shell: bash
        run: |
          [[ "$(x86_64-aros-gcc -dumpversion)" == 6.5.0 ]] || { echo 'Expected GCC 6.5.0' >&2; exit 2; }
      - name: Checkout Odyssey revision
        run: bash tools/odyssey/fetch_upstream.sh
      - name: Configure Odyssey
        shell: bash
        run: |
          set -o pipefail
          bash tools/odyssey/configure_x86_64.sh 2>&1 | tee odyssey-configure.log
      - name: Compile Odyssey
        shell: bash
        run: |
          set -o pipefail
          make -C external-src/OdysseyWebBrowser/cross-build-x86_64-aros -j2 2>&1 | tee odyssey-build.log
      - name: Verify and package build output
        shell: bash
        run: |
          bin=external-src/OdysseyWebBrowser/cross-build-x86_64-aros/bin
          test -d "$bin"
          find "$bin" -maxdepth 1 -type f -executable -exec file -- {} + > odyssey-binaries.log
          grep -E 'ELF 64-bit.*(executable|pie executable).*x86-64' odyssey-binaries.log
          tar -czf odyssey-x86_64-aros.tar.gz -C "$(dirname "$bin")" bin
          sha256sum odyssey-x86_64-aros.tar.gz > odyssey-x86_64-aros.tar.gz.sha256
      - name: Upload Odyssey binaries
        uses: actions/upload-artifact@v4
        with:
          name: odyssey-x86_64-aros
          path: |
            odyssey-x86_64-aros.tar.gz
            odyssey-x86_64-aros.tar.gz.sha256
          if-no-files-found: error
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odyssey-build-logs
          path: |
            aros-sdk-build.log
            odyssey-configure.log
            odyssey-build.log
            odyssey-binaries.log
          if-no-files-found: ignore
