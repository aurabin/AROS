name: SMP Exec lock flag regression
on:
  push:
    branches:
      - work/native-smp-stabilization
  pull_request:
    paths:
      - 'rom/exec/exec_locks.c'
      - 'tests/smp_exec_lock_flags.py'
      - 'rom/exec/wait.c'
      - 'tests/smp_wait_signal_ack.py'
      - '.github/workflows/smp-lock-flags.yml'
jobs:
  lock-flags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate lock flag bitmasks
        run: |
          python3 tests/smp_exec_lock_flags.py
          python3 tests/smp_wait_signal_ack.py
