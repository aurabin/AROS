name: AROS One staging validation

on:
  push:
    paths:
      - 'distributions/aros-one/**'
      - '.github/workflows/aros-one-staging.yml'
  pull_request:
    paths:
      - 'distributions/aros-one/**'
      - '.github/workflows/aros-one-staging.yml'

permissions:
  contents: read

jobs:
  validate-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate distribution metadata
        run: python distributions/aros-one/validate.py
      - name: Test safety constraints
        run: cd distributions/aros-one && python -m unittest discover -v
