name: Odyssey integration preflight
on:
  push:
    paths:
      - 'tools/odyssey/**'
      - 'tests/test_odyssey_integration.py'
      - '.github/workflows/odyssey-preflight.yml'
  pull_request:
    paths:
      - 'tools/odyssey/**'
      - 'tests/test_odyssey_integration.py'
      - '.github/workflows/odyssey-preflight.yml'
  workflow_dispatch:
jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: |
          bash -n tools/odyssey/fetch_upstream.sh
          bash -n tools/odyssey/build_x86_64.sh
          bash -n tools/odyssey/toolchain_preflight.sh
      - name: Run regression checks
        run: python3 -m unittest discover -s tests -p 'test_odyssey_integration.py' -v
      - name: Check Odyssey upstream connectivity
        run: git ls-remote --exit-code --heads https://github.com/deadwood2/OdysseyWebBrowser.git odyssey
      - name: Report toolchain availability (informational)
        shell: bash
        run: |
          if bash tools/odyssey/toolchain_preflight.sh; then
            echo 'AROS cross-compiler available; separate build validation is still required.'
          else
            echo 'AROS cross-compiler absent: full browser build is blocked.'
          fi
